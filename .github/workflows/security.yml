name: Security

# Free-tier security scans that do not require GitHub Advanced Security.
#   - govulncheck   : official Go vulnerability scanner (stdlib + module graph)
#   - dependency review : blocks vulnerable / license-incompatible additions in PRs
#
# Results:
#   govulncheck    -> job logs (step summary)
#   dependency rev -> inline PR annotations

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          # No go.sum: this module has no third-party dependencies,
          # so there is nothing to cache and setup-go would warn on every run.
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        # `shell: bash` (rather than the default) enables `pipefail`. The
        # output is captured first and the exit code replayed, so the step
        # summary is written even when the scan fails.
        shell: bash
        run: |
          status=0
          govulncheck ./... > govulncheck.txt 2>&1 || status=$?
          cat govulncheck.txt
          {
            echo "## govulncheck"
            echo
            echo '```'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::govulncheck found vulnerabilities in the Go standard library"
          echo "::error::Fix by moving to a patched Go toolchain (bump go-version in"
          echo "::error::this workflow and the golang: base image in the Dockerfile),"
          echo "::error::then re-run. The findings and their fix versions are in the"
          echo "::error::step summary above."

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # Required for comment-summary-in-pr; without it the action swallows
      # the 403 and the summary never appears.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
