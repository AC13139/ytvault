services:
  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      YTVAULT_ADDR: ":8080"
      YTVAULT_DATA_PATH: /data/state.json
      YTVAULT_DOWNLOAD_PATH: /data/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
